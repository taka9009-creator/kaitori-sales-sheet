<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded Spreadsheet Base -->
  <rect x="4" y="4" width="52" height="52" rx="12" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Spreadsheet Header Bar -->
  <path d="M4 16 C4 9.373 9.373 4 16 4 L44 4 C50.627 4 56 9.373 56 16 L56 19 L4 19 Z" fill="#065f46" opacity="0.55" />

  <!-- Spreadsheet Grid Cells -->
  <g fill="#ffffff" opacity="0.92">
    <!-- Row 1 -->
    <rect x="11" y="23" width="11" height="6" rx="1.5" />
    <rect x="25" y="23" width="24" height="6" rx="1.5" />
    <!-- Row 2 -->
    <rect x="11" y="32" width="11" height="6" rx="1.5" />
    <rect x="25" y="32" width="24" height="6" rx="1.5" />
    <!-- Row 3 -->
    <rect x="11" y="41" width="11" height="6" rx="1.5" />
    <rect x="25" y="41" width="16" height="6" rx="1.5" />
  </g>

  <!-- Gold Coin Badge (Bottom-Right) -->
  <circle cx="46" cy="46" r="15" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
  <circle cx="46" cy="46" r="11.5" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="2 1.5" />

  <!-- Yen Symbol inside Gold Coin -->
  <path d="M41.5 39.5 L46 45.5 L50.5 39.5 M42.5 46.5 H49.5 M42.5 49.5 H49.5 M46 45.5 V53" stroke="#78350f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
